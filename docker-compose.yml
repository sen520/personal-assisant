version: '3.8'

services:
  # ChromaDB 向量数据库服务
  chromadb:
    build:
      context: ./chroma
      dockerfile: Dockerfile
    image: personal-assistant/chroma:latest
    container_name: chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - CHROMA_SERVER_HOST=0.0.0.0
      - CHROMA_SERVER_HTTP_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可选：Redis 缓存服务（用于短期记忆）
  redis:
    image: redis:7-alpine
    container_name: assistant-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  chroma_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: assistant-network